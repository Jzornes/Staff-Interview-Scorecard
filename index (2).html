<style>
  :root {
    --paper: #F8F5EE;
    --surface: #FFFFFF;
    --ink: #0F1E3D;
    --ink-soft: #55627F;
    --hairline: #B9C6E8;
    --gold: #2A4494;
    --gold-soft: #E2E9FB;
    --red: #A8412F;
    --amber: #B8863C;
    --green: #2F6F4E;
    --shadow: 0 1px 2px rgba(15,30,61,0.06), 0 4px 14px rgba(15,30,61,0.06);
  }
  * { box-sizing: border-box; }

  .sc-root {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100%;
    padding: 20px;
    line-height: 1.45;
    position: relative;
  }

  /* ---- reviewer prompt overlay ---- */
  .sc-overlay {
    position: fixed; inset: 0; background: rgba(31,59,87,0.55);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .sc-overlay-card {
    background: var(--surface); border-radius: 14px; padding: 28px; max-width: 380px; width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  .sc-overlay-card h2 { font-size: 18px; margin: 0 0 6px 0; color: var(--ink); }
  .sc-overlay-card p { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 16px 0; }
  .sc-overlay-card input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--hairline); border-radius: 8px;
    font-size: 14px; margin-bottom: 10px;
  }
  .sc-overlay-card button.sc-primary {
    width: 100%; padding: 10px; border-radius: 8px; border: none; background: var(--ink);
    color: #fff; font-weight: 700; font-size: 13px; cursor: pointer;
  }
  .sc-recent-names { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .sc-recent-names button {
    border: 1px solid var(--hairline); background: var(--gold-soft); color: var(--gold);
    padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer;
  }

  .sc-masthead {
    display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px;
    border-bottom: 3px solid var(--gold); padding-bottom: 14px; margin-bottom: 14px;
  }
  .sc-masthead .eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 4px; }
  .sc-masthead h1 { font-size: 23px; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
  .sc-masthead .sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }

  .sc-view-toggle { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px; padding: 3px; box-shadow: var(--shadow); }
  .sc-view-toggle button { border: none; background: transparent; padding: 7px 13px; font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; color: var(--ink-soft); }
  .sc-view-toggle button.active { background: var(--ink); color: #fff; }

  .sc-reviewer-bar {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-size: 12.5px; color: var(--ink-soft);
  }
  .sc-reviewer-pill {
    background: var(--gold-soft); color: var(--gold); font-weight: 700; padding: 5px 12px; border-radius: 999px; font-size: 12px;
  }
  .sc-reviewer-bar button {
    border: none; background: transparent; color: var(--ink-soft); text-decoration: underline; font-size: 12px; cursor: pointer; padding: 0;
  }

  .sc-schedule-dash { border: 1.5px solid var(--gold); border-radius: 12px; background: var(--surface); padding: 16px 18px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .sc-schedule-dash-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 800; color: var(--gold); margin: 0 0 12px 0; padding-bottom: 8px; border-bottom: 2px solid var(--gold); }

  .sc-section-box { border: 1.5px solid var(--hairline); border-radius: 12px; background: var(--surface); padding: 16px 18px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .sc-section-title { font-size: 12.5px; font-weight: 800; color: var(--gold); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 14px 0; padding-bottom: 8px; border-bottom: 2px solid var(--gold); }
  .sc-section-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 14px 0; padding-bottom: 8px; border-bottom: 2px solid var(--gold); }
  .sc-archive-toggle { border: 1px solid var(--hairline); background: var(--surface); color: var(--gold); font-size: 11px; font-weight: 700; padding: 5px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .sc-tab.sc-tab-archived { opacity: 0.55; border-style: dashed; }
  .sc-section-box .sc-tabs, .sc-section-box .sc-meta-row { margin-bottom: 0; }
  .sc-interview-title { font-size: 14.5px; margin-bottom: 18px; }
  .sc-schedule-dash-row { display: flex; gap: 18px; overflow-x: auto; padding-bottom: 4px; }
  .sc-schedule-day-col { flex: 0 0 auto; min-width: 140px; border-left: 2px solid var(--hairline); padding-left: 14px; }
  .sc-schedule-day-col:first-child { border-left: none; padding-left: 0; }
  .sc-schedule-day-head { font-size: 11.5px; font-weight: 800; color: var(--ink); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  .sc-schedule-unscheduled .sc-schedule-day-head { color: var(--ink-soft); }
  .sc-schedule-chip { background: var(--paper); border: 1px solid var(--hairline); border-radius: 8px; padding: 7px 10px; margin-bottom: 8px; cursor: pointer; }
  .sc-schedule-chip.sc-chip-past { opacity: 0.45; }
  .sc-schedule-chip.sc-chip-next { border: 1.5px solid var(--green); background: #EAF3EC; box-shadow: 0 0 0 2px rgba(47,111,78,0.15); }
  .sc-chip-next-label { font-size: 10px; font-weight: 800; color: var(--green); margin-top: 2px; }
  .sc-schedule-chip:hover { border-color: var(--gold); }
  .sc-schedule-chip.active { border-color: var(--gold); background: var(--gold-soft); }
  .sc-schedule-chip-time { font-size: 11px; font-weight: 700; color: var(--gold); }
  .sc-schedule-chip-name { font-size: 12px; font-weight: 600; color: var(--ink); }

  .sc-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; align-items: center; }
  .sc-tab {
    flex: 0 0 auto; background: var(--surface); border: 1px solid var(--hairline); border-bottom: 3px solid transparent;
    border-radius: 8px 8px 0 0; padding: 8px 14px; font-size: 13px; font-weight: 600; color: var(--ink-soft);
    cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .sc-tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hairline); flex: 0 0 auto; }
  .sc-tab.active { color: var(--ink); border-bottom-color: var(--gold); box-shadow: var(--shadow); }
  .sc-tab.sc-tab-past { opacity: 0.45; }
  .sc-tab.sc-tab-next { border: 1.5px solid var(--green); background: #EAF3EC; }
  .sc-tab-next-badge { font-size: 10px; font-weight: 800; color: var(--green); }
  .sc-tab-add {
    flex: 0 0 auto; background: transparent; border: 1px dashed var(--hairline); border-radius: 8px;
    padding: 8px 14px; font-size: 13px; font-weight: 600; color: var(--gold); cursor: pointer;
  }
  .sc-tab-del { border: none; background: transparent; color: var(--ink-soft); cursor: pointer; font-size: 13px; padding: 0 2px; line-height: 1; }
  .sc-tab-del:hover { color: var(--red); }

  .sc-meta-row { display: flex; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }

  .sc-details-layout { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .sc-photo-block { flex: 0 0 110px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .sc-photo-preview { width: 96px; height: 96px; border-radius: 50%; overflow: hidden; border: 2px solid var(--hairline); background: var(--paper); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .sc-photo-preview img { width: 100%; height: 100%; object-fit: cover; }
  .sc-photo-placeholder { font-size: 38px; color: var(--ink-soft); }
  .sc-photo-upload-btn { width: 100%; font-size: 11px; padding: 6px 8px; border: 1px dashed var(--gold); background: var(--gold-soft); color: var(--gold); font-weight: 700; border-radius: 6px; cursor: pointer; }
  .sc-photo-upload-btn:disabled { opacity: 0.6; cursor: default; }
  .sc-photo-or { font-size: 10px; color: var(--ink-soft); text-align: center; }
  .sc-photo-url-input { width: 100%; font-size: 10.5px; padding: 5px 7px; border: 1px solid var(--hairline); border-radius: 6px; text-align: center; background: var(--surface); }

  .sc-chart-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .sc-chart-block { flex: 1 1 180px; min-width: 160px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .sc-chart-label { font-size: 11px; font-weight: 700; color: var(--ink-soft); text-align: center; }
  .sc-chart-preview { width: 100%; max-width: 220px; height: 130px; border-radius: 10px; overflow: hidden; border: 2px solid var(--hairline); background: var(--paper); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .sc-chart-preview img { width: 100%; height: 100%; object-fit: contain; }

  .sc-trait-ref { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hairline); }
  .sc-trait-ref h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gold); margin: 0 0 10px 0; font-weight: 800; }
  .sc-disc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .sc-disc-grid { grid-template-columns: 1fr; } }
  .sc-disc-item { display: flex; gap: 10px; align-items: flex-start; background: var(--paper); border: 1px solid var(--hairline); border-radius: 8px; padding: 10px; }
  .sc-disc-letter { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background: var(--gold); color: #fff; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .sc-disc-name { font-size: 12px; font-weight: 700; color: var(--ink); margin-bottom: 2px; }
  .sc-disc-desc { font-size: 11px; color: var(--ink-soft); line-height: 1.4; }
  table.sc-trait-table { width: 100%; border-collapse: collapse; font-size: 11.5px; min-width: 480px; margin-top: 10px; }
  table.sc-trait-table th { background: var(--ink); color: #fff; text-align: left; padding: 7px 10px; font-weight: 700; }
  table.sc-trait-table td { padding: 6px 10px; border-bottom: 1px solid var(--hairline); }
  table.sc-trait-table tr:nth-child(even) td { background: var(--paper); }
  .sc-details-right { flex: 1; min-width: 240px; }

  .sc-prenotes { border: 1.5px solid var(--gold); border-radius: 10px; background: var(--surface); margin-bottom: 20px; overflow: hidden; box-shadow: var(--shadow); }
  .sc-prenotes-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--gold-soft); cursor: pointer; flex-wrap: wrap; }
  .sc-prenotes-head h3 { font-size: 14px; font-weight: 800; color: var(--gold); margin: 0; }
  .sc-prenotes-hint { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; }
  .sc-prenotes-body { padding: 14px 16px; }
  .sc-prenotes-label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--gold); margin: 12px 0 6px 0; }
  .sc-prenotes-label:first-child { margin-top: 0; }
  .sc-prenotes-area { width: 100%; min-height: 70px; border: 1px solid var(--hairline); border-radius: 8px; padding: 10px 12px; font-size: 13px; font-family: inherit; color: var(--ink); resize: vertical; background: var(--paper); }
  .sc-prenotes-area:focus { outline: 1.5px solid var(--gold); }
  .sc-prenotes-footnote { font-size: 11px; color: var(--ink-soft); margin-top: 8px; }
  .sc-meta-field { background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 150px; }
  .sc-meta-field label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); font-weight: 700; }
  .sc-meta-field input { border: none; background: transparent; font-size: 13px; color: var(--ink); font-weight: 600; padding: 0; }
  .sc-meta-field input:focus { outline: none; }

  .sc-grid { display: grid; grid-template-columns: 1fr 300px; gap: 22px; align-items: start; }
  @media (max-width: 860px) { .sc-grid { grid-template-columns: 1fr; } .sc-summary { order: -1; } }

  .sc-category {
    margin-bottom: 24px; border: 1.5px solid var(--hairline); border-radius: 14px;
    background: var(--surface); overflow: hidden; box-shadow: var(--shadow);
  }
  .sc-category-body { padding: 16px 18px 6px 18px; }
  .sc-category-head h2 { font-size: 18px; font-weight: 800; margin: 0; color: #FFFFFF; }
  .sc-weight-badge { font-size: 10.5px; font-weight: 700; color: var(--gold); background: var(--surface); border: 1px solid var(--hairline); padding: 3px 9px; border-radius: 999px; letter-spacing: 0.02em; }
  .sc-notscored-badge { font-size: 10.5px; font-weight: 700; color: var(--ink-soft); background: var(--surface); border: 1px solid var(--hairline); padding: 3px 9px; border-radius: 999px; letter-spacing: 0.02em; }
  .sc-nonscored-head h2 { color: #FFFFFF; }
  .sc-category-avg { margin-left: auto; font-size: 12px; color: #FFFFFF; font-weight: 600; opacity: 0.9; }

  .sc-question { background: var(--surface); border: 1.5px solid var(--hairline); border-left: 4px solid var(--gold); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .sc-question-head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
  .sc-question-text { font-size: 13.5px; font-weight: 700; margin: 0; color: var(--ink); flex: 1; }
  .sc-asked-check { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; cursor: pointer; flex: 0 0 auto; padding-top: 2px; }
  .sc-asked-check input { width: 14px; height: 14px; cursor: pointer; accent-color: var(--gold); }
  .sc-collapse-btn { border: none; background: none; color: var(--ink-soft); cursor: pointer; font-size: 11px; padding: 2px 4px 2px 0; flex: 0 0 auto; margin-top: 1px; }

  .sc-question-collapsed { padding: 9px 14px; cursor: pointer; border-left: 4px solid var(--hairline); }
  .sc-question-collapsed:hover { border-color: var(--gold); border-left-color: var(--gold); }
  .sc-collapsed-row { display: flex; align-items: center; gap: 10px; }
  .sc-collapsed-chevron { color: var(--ink-soft); font-size: 10px; flex: 0 0 auto; }
  .sc-collapsed-text { flex: 1; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sc-collapsed-badges { display: flex; gap: 6px; align-items: center; font-size: 11px; font-weight: 700; flex: 0 0 auto; }
  .sc-collapsed-badges .g { color: var(--green); }
  .sc-collapsed-badges .r { color: var(--red); }
  .sc-collapsed-score { background: var(--gold-soft); color: var(--gold); padding: 1px 7px; border-radius: 999px; }

  .sc-category-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; background: var(--gold); flex-wrap: wrap; cursor: pointer; }
  .sc-nonscored-head { background: var(--ink-soft); }
  .sc-cat-chevron { font-size: 12px; color: #FFFFFF; flex: 0 0 auto; }
  .sc-help { font-size: 12px; color: var(--ink-soft); margin: 0 0 4px 0; }
  .sc-help b { color: var(--ink); }
  .sc-help.redflag b { color: var(--red); }
  .sc-help-toggle { font-size: 11.5px; color: var(--gold); font-weight: 700; cursor: pointer; margin-top: 4px; display: inline-block; user-select: none; }
  .sc-help-body { margin-top: 8px; }

  .sc-score-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  .sc-tech-wrap { margin-top: 10px; }
  .sc-tech-legend { font-size: 11px; color: var(--ink-soft); margin-bottom: 8px; }
  .sc-tech-list { display: flex; flex-direction: column; gap: 6px; }
  .sc-tech-row { display: flex; align-items: center; gap: 16px; padding: 7px 12px; border: 1px solid var(--hairline); border-radius: 7px; background: var(--surface); flex-wrap: wrap; }
  .sc-tech-tool-name { font-weight: 700; font-size: 12.5px; color: var(--ink); flex: 1 1 120px; min-width: 110px; }
  .sc-tech-checkbox-label { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-soft); font-weight: 600; cursor: pointer; white-space: nowrap; }
  .sc-tech-checkbox-label input { width: 14px; height: 14px; cursor: pointer; accent-color: var(--gold); }
  .sc-score-btn { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--hairline); background: var(--surface); font-size: 13px; font-weight: 700; color: var(--ink-soft); cursor: pointer; }
  .sc-score-btn.selected-1 { background: var(--red); color: #fff; border-color: var(--red); }
  .sc-score-btn.selected-2 { background: #C97A5C; color: #fff; border-color: #C97A5C; }
  .sc-score-btn.selected-3 { background: var(--amber); color: #fff; border-color: var(--amber); }
  .sc-score-btn.selected-4 { background: #6B9B6E; color: #fff; border-color: #6B9B6E; }
  .sc-score-btn.selected-5 { background: var(--green); color: #fff; border-color: var(--green); }
  .sc-score-label { font-size: 11px; color: var(--ink-soft); margin-left: 4px; }

  .sc-notes { width: 100%; margin-top: 10px; border: 1px solid var(--hairline); border-radius: 7px; padding: 8px 10px; font-size: 12.5px; font-family: inherit; color: var(--ink); resize: vertical; min-height: 44px; background: var(--paper); }
  .sc-notes:focus { outline: 1.5px solid var(--gold); }

  .sc-summary { position: sticky; top: 16px; background: var(--surface); border: 1.5px solid var(--hairline); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); }
  .sc-summary h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); margin: 0 0 12px 0; font-weight: 700; }
  .sc-gauge-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 14px; }
  .sc-gauge-total { font-size: 26px; font-weight: 800; margin-top: -34px; }
  .sc-gauge-max { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
  .sc-gauge-verdict { font-size: 11.5px; font-weight: 700; margin-top: 2px; letter-spacing: 0.02em; }

  .sc-catbar-row { margin-bottom: 9px; }
  .sc-catbar-label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-soft); margin-bottom: 3px; font-weight: 600; }
  .sc-catbar-track { height: 6px; background: var(--paper); border-radius: 4px; overflow: hidden; }
  .sc-catbar-fill { height: 100%; border-radius: 4px; }

  .sc-answered-note { font-size: 11px; color: var(--ink-soft); margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--hairline); }

  .sc-recommend { margin-top: 14px; }
  .sc-recommend label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); font-weight: 700; display:block; margin-bottom:6px; }
  .sc-recommend select { width: 100%; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--hairline); font-size: 12.5px; background: var(--paper); color: var(--ink); font-weight: 600; }

  .sc-flag-row { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .sc-flag-btn { border: 1px solid var(--hairline); background: var(--surface); font-size: 11.5px; font-weight: 700; padding: 6px 12px; border-radius: 7px; cursor: pointer; color: var(--ink-soft); }
  .sc-flag-btn.green-active { background: var(--green); color: #fff; border-color: var(--green); }
  .sc-flag-btn.red-active { background: var(--red); color: #fff; border-color: var(--red); }
  .sc-flag-note { margin-top: 8px; width: 100%; border: 1px solid var(--hairline); border-radius: 7px; padding: 8px 10px; font-size: 12.5px; font-family: inherit; background: var(--paper); resize: vertical; min-height: 40px; }
  .sc-flag-note:focus { outline: 1.5px solid var(--gold); }
  .sc-cat-flag-counts { display: flex; gap: 6px; font-size: 11px; font-weight: 700; }
  .sc-cat-flag-counts .g, .sc-cat-flag-counts .r { background: var(--surface); padding: 3px 9px; border-radius: 999px; }
  .sc-cat-flag-counts .g { color: var(--green); }
  .sc-cat-flag-counts .r { color: var(--red); }

  .sc-recap { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--hairline); }
  .sc-recap h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin: 0 0 8px 0; font-weight: 700; }
  .sc-recap-empty { font-size: 11.5px; color: var(--ink-soft); }
  .sc-recap-sub { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; margin: 10px 0 6px 0; }
  .sc-recap-sub.green { color: var(--green); }
  .sc-recap-sub.red { color: var(--red); }
  .sc-recap-item { font-size: 12px; padding: 7px 9px; border-radius: 6px; margin-bottom: 6px; }
  .sc-recap-item.green { background: #EAF3EC; border-left: 3px solid var(--green); }
  .sc-recap-item.red { background: #F7E9E6; border-left: 3px solid var(--red); }
  .sc-recap-item .rq { font-weight: 700; margin-bottom: 2px; color: var(--ink); }
  .sc-recap-item .rn { color: var(--ink-soft); }

  .sc-colleague-box { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--hairline); }
  .sc-colleague-box h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin: 0 0 8px 0; font-weight: 700; }
  .sc-colleague-row { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; padding: 6px 0; border-bottom: 1px dashed var(--hairline); }

<div id="sc-app" class="sc-root"></div>

<script>
(function(){

  var DEFAULT_CATEGORIES = [

    { id: 'technical', name: 'Technical and Close Out', weight: 1, questions: [
      { id: 'q31', text: "Software familiarity: AppFolio, LeadSimple, Canva, social media platforms, Outlook, Teams, Notion." },
      { id: 'q32', text: "If your internet or power goes down during work hours, what is your backup plan?" },
      { id: 'q33', noScore: true, text: "What is your hourly rate expectation, and hopes for growth?" },
      { id: 'q34', noScore: true, text: "Do you want something more long term, or temporary?" },
      { id: 'q35', noScore: true, text: "When would you be available to start?" },
      { id: 'q36', noScore: true, text: "Confirm they understand the schedule: 9\u20135:30pm PST, Monday\u2013Friday." },
      { id: 'q37', noScore: true, text: "What questions do you have for us?" },
    ]},
    { id: 'overall', name: 'Overall Applicant Assessment', weight: 1, questions: [
      { id: 'q38', text: "Punctuality: were they on time, or late \u2014 and by how much?" },
      { id: 'q39', text: "Clarity and articulation in their answers." },
      { id: 'q40', text: "Confidence and composure \u2014 did they seem nervous, or settle in as the interview went on?" },
      { id: 'q41', text: "Audio/video quality and remote work setup: clear mic, minimal background noise, any connectivity issues." },
      { id: 'q42', text: "Overall professionalism and enthusiasm for the role." },
      { id: 'q43', text: "Overall gut check: would you want them representing McLain on calls with tenants, owners, and vendors?" },
      { id: 'q44', noScore: true, isTechChecklist: true, text: "Software & Tools Knowledge \u2014 click each to mark what they already know vs. what would need training.",
        tools: ["AppFolio","LeadSimple","Outlook","Teams","OneDrive","LetHub","Watermarkly","Canva","YouTube","Jotform","DocuSign","ZInspector","Latchel","PetScreening","Social media platforms"] },
    ]},
  ];

  var CAND_KEY = 'shared-candidates';
  var QSET_KEY = 'shared-question-set-v6';
  var NAMES_KEY = 'shared-reviewer-names';
  var ASKED_KEY = 'shared-asked-tracker';
  function sanitizeFirebaseKey(k) { return String(k).replace(/[.#$\[\]\/]/g, '_'); }
  function reviewerDataKey(name) { return 'reviewer-data-' + sanitizeFirebaseKey(name); }

  // This page runs as a plain website (not inside a Claude artifact), so it talks
  // directly to Firebase Realtime Database - genuinely shared across anyone who
  // opens this page, regardless of device or account.
  var FIREBASE_DB_URL = 'https://interviewer-scorecard-default-rtdb.firebaseio.com';

  var state = {
    reviewerName: null,
    knownReviewers: [],
    candidatesMeta: { order: [], byId: {} }, // id -> {name, date, interviewer}
    askedMap: {}, // candidateId -> {qid: true}
    categories: [],
    mine: { scores: {}, notes: {}, rec: {}, flags: {}, tech: {} }, // candidateId -> {qid:score} etc, rec: candidateId -> string, flags: candidateId -> {qid:{type,note}}, tech: candidateId -> {qid:{toolName:'know'|'train'}}
    activeId: null,
    view: 'scorecard', // scorecard | compare | manage
    openHelp: {},
    noteOpen: {},
    expandedQuestions: {}, // qid -> explicit true/false override; unset = default based on asked
    collapsedCats: {}, // catId -> true if collapsed
    preNotesOpen: {}, // candId -> bool
    personalityOpen: {}, // candId -> bool
    personalityRefOpen: {}, // candId -> bool
    colleagueCache: {}, // name -> {scores,notes,rec}
    colleagueLoading: {},
    compareLoaded: false,
    compareLoading: false,
    saveStatus: 'ok',
    showArchived: false
  };

  var saveTimers = {};
  function debouncedSave(key, fn) {
    clearTimeout(saveTimers[key]);
    saveTimers[key] = setTimeout(fn, 500);
  }

  function uid() { return 'x' + Math.random().toString(36).slice(2, 10); }

  function sleep(ms) { return new Promise(function(res){ setTimeout(res, ms); }); }

  // Serialize all writes so concurrent set() calls (e.g. asked + scores + categories
  // firing close together) never race each other, and retry transient server errors.
  var writeQueue = Promise.resolve();
  function queueWrite(fn) {
    var result = writeQueue.then(fn, fn);
    writeQueue = result.catch(function(){});
    return result;
  }

  async function safeGet(key) {
    try {
      var res = await fetch(FIREBASE_DB_URL + '/' + encodeURIComponent(key) + '.json');
      if (!res.ok) return null;
      var data = await res.json();
      return (data === null || data === undefined) ? null : data;
    } catch (e) {
      console.error('load failed', key, e);
      return null;
    }
  }

  function safeSet(key, val) {
    return queueWrite(async function() {
      var attempts = 0;
      var payload;
      try {
        payload = JSON.stringify(val);
      } catch (e) {
        console.error('serialize failed', key, e);
        return false;
      }
      while (attempts < 4) {
        try {
          var res = await fetch(FIREBASE_DB_URL + '/' + encodeURIComponent(key) + '.json', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: payload
          });
          if (!res.ok) throw new Error('Firebase set failed: HTTP ' + res.status);
          state.saveStatus = 'ok';
          return true;
        } catch (e) {
          attempts++;
          console.error('save attempt ' + attempts + ' failed for ' + key, e);
          if (attempts >= 4) {
            state.saveStatus = 'error';
            renderSaveStatusOnly();
            return false;
          }
          await sleep(300 * attempts);
        }
      }
      return false;
    });
  }

  function renderSaveNote() {
    if (state.saveStatus === 'error') {
      return el('div', { class: 'sc-save-note', style: 'color:var(--red); font-weight:700;' }, [
        'Having trouble saving right now \u2014 keep working, it will retry automatically. If this persists, your latest change may not be saved.'
      ]);
    }
    return el('div', { class: 'sc-save-note' }, ['Your scores and notes save automatically \u2014 they\u2019re private to you. Check Compare All to see how your colleague scored the same candidate.']);
  }

  function renderSaveStatusOnly() {
    var note = root.querySelector('.sc-save-note');
    if (!note) return;
    if (state.saveStatus === 'error') {
      note.textContent = 'Having trouble saving right now \u2014 keep working, it will retry automatically. If this persists, your latest change may not be saved.';
      note.style.color = 'var(--red)';
      note.style.fontWeight = '700';
    }
  }

  function totalMaxWeight() {
    return state.categories.reduce(function(s,c){ return c.nonScored ? s : s + Number(c.weight || 0); }, 0) * 5;
  }

  function categoryStatsFor(scores, cat) {
    var scored = [];
    cat.questions.forEach(function(q){ var v = scores[q.id]; if (v) scored.push(v); });
    var avg = scored.length ? (scored.reduce(function(a,b){return a+b;},0) / scored.length) : 0;
    return { avg: avg, answered: scored.length, total: cat.questions.length, weighted: avg * Number(cat.weight || 0) };
  }
  function overallStatsFor(scores) {
    var weighted = 0, answeredQ = 0, totalQ = 0;
    state.categories.forEach(function(cat){
      if (cat.nonScored) return;
      var s = categoryStatsFor(scores, cat);
      weighted += s.weighted; answeredQ += s.answered; totalQ += s.total;
    });
    return { weighted: weighted, max: totalMaxWeight(), answeredQ: answeredQ, totalQ: totalQ };
  }
  function verdictFor(pct) {
    if (pct >= 0.75) return { label: 'Strong', color: 'var(--green)' };
    if (pct >= 0.5) return { label: 'Meets bar', color: 'var(--amber)' };
    if (pct > 0) return { label: 'Below bar', color: 'var(--red)' };
    return { label: 'Not yet scored', color: 'var(--ink-soft)' };
  }

  function myScoresFor(candId) { return state.mine.scores[candId] || (state.mine.scores[candId] = {}); }
  function myNotesFor(candId) { return state.mine.notes[candId] || (state.mine.notes[candId] = {}); }
  function myFlagsFor(candId) { return state.mine.flags[candId] || (state.mine.flags[candId] = {}); }
  function myTechFor(candId, qid) {
    if (!state.mine.tech[candId]) state.mine.tech[candId] = {};
    if (!state.mine.tech[candId][qid]) state.mine.tech[candId][qid] = {};
    return state.mine.tech[candId][qid];
  }

  function migrateFlags() {
    // upgrade old single-flag shape {type, note} to independent {pro, con}
    Object.keys(state.mine.flags || {}).forEach(function(candId){
      var perQ = state.mine.flags[candId];
      Object.keys(perQ).forEach(function(qid){
        var f = perQ[qid];
        if (f && f.type) {
          var text = f.note || '';
          if (f.type === 'green') perQ[qid] = { pro: text, con: '' };
          else perQ[qid] = { pro: '', con: text };
        }
      });
    });
  }

  function flagCountsForCategory(candId, cat) {
    var flags = myFlagsFor(candId);
    var g = 0, r = 0;
    cat.questions.forEach(function(q){
      var f = flags[q.id];
      if (f && f.pro && f.pro.trim()) g++;
      if (f && f.con && f.con.trim()) r++;
    });
    return { g: g, r: r };
  }

  function saveMine() {
    debouncedSave('mine', function(){
      safeSet(reviewerDataKey(state.reviewerName), state.mine);
    });
  }
  function saveCandidates() {
    debouncedSave('cands', function(){ safeSet(CAND_KEY, state.candidatesMeta); });
  }
  function saveCategories() {
    debouncedSave('cats', function(){ safeSet(QSET_KEY, state.categories); });
  }
  function saveAsked() {
    debouncedSave('asked', function(){ safeSet(ASKED_KEY, state.askedMap); });
  }
  function askedFor(candId) { return state.askedMap[candId] || (state.askedMap[candId] = {}); }
  function isQuestionExpanded(qid, asked) {
    if (state.expandedQuestions.hasOwnProperty(qid)) return state.expandedQuestions[qid];
    return !asked[qid];
  }

  // ---------- element helper ----------
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function(c){
      if (typeof c === 'string') e.appendChild(document.createTextNode(c));
      else if (c) e.appendChild(c);
    });
    return e;
  }

  var root = document.getElementById('sc-app');

  // ---------- reviewer prompt ----------
  function renderReviewerPrompt() {
    root.innerHTML = '';
    var overlay = el('div', { class: 'sc-overlay' });
    var card = el('div', { class: 'sc-overlay-card' });
    card.appendChild(el('h2', {}, ['Who\u2019s scoring?']));
    card.appendChild(el('p', {}, ['Your scores and notes stay separate from your colleague\u2019s. Pick your name or enter a new one.']));

    if (state.knownReviewers.length) {
      var recent = el('div', { class: 'sc-recent-names' });
      state.knownReviewers.forEach(function(name){
        recent.appendChild(el('button', { onclick: function(){ selectReviewer(name); } }, [name]));
      });
      card.appendChild(recent);
    }

    var input = el('input', { placeholder: 'Type your name\u2026' });
    card.appendChild(input);
    card.appendChild(el('button', {
      class: 'sc-primary',
      onclick: function(){
        var v = input.value.trim();
        if (!v) { input.focus(); return; }
        selectReviewer(v);
      }
    }, ['Start scoring']));
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') { var v = input.value.trim(); if (v) selectReviewer(v); } });

    overlay.appendChild(card);
    root.appendChild(overlay);
    setTimeout(function(){ input.focus(); }, 50);
  }

  async function refreshAllColleagueData() {
    var others = state.knownReviewers.filter(function(n){ return n !== state.reviewerName; });
    for (var i = 0; i < others.length; i++) {
      var data = await safeGet(reviewerDataKey(others[i]));
      var normalized = data || {};
      if (!normalized.scores) normalized.scores = {};
      if (!normalized.notes) normalized.notes = {};
      if (!normalized.rec) normalized.rec = {};
      if (!normalized.flags) normalized.flags = {};
      if (!normalized.tech) normalized.tech = {};
      if (!normalized.preNotes) normalized.preNotes = {};
      if (!normalized.preQuestions) normalized.preQuestions = {};
      if (!normalized.techGapsNote) normalized.techGapsNote = {};
      state.colleagueCache[others[i]] = normalized;
    }
  }

  async function selectReviewer(name) {
    state.reviewerName = name;
    if (state.knownReviewers.indexOf(name) === -1) {
      state.knownReviewers.push(name);
      await safeSet(NAMES_KEY, state.knownReviewers);
    }
    var mine = await safeGet(reviewerDataKey(name));
    state.mine = mine || {};
    // Firebase drops empty objects entirely on save, so any field that was still
    // empty last time we saved (e.g. no scores yet) simply won't come back at all.
    // Re-patch every expected field here rather than trusting what loaded.
    if (!state.mine.scores) state.mine.scores = {};
    if (!state.mine.notes) state.mine.notes = {};
    if (!state.mine.rec) state.mine.rec = {};
    if (!state.mine.flags) state.mine.flags = {};
    if (!state.mine.tech) state.mine.tech = {};
    if (!state.mine.preNotes) state.mine.preNotes = {};
    if (!state.mine.preQuestions) state.mine.preQuestions = {};
    if (!state.mine.techGapsNote) state.mine.techGapsNote = {};
    migrateFlags();
    if (!state.activeId) {
      var activeIds = activeCandidateIds();
      state.activeId = activeIds.length ? activeIds[0] : (state.candidatesMeta.order[0] || null);
    }
    render();
  }

  // ---------- gauge ----------
  function gaugeSvg(pct, color, width) {
    width = width || 150;
    var height = Math.round(width * 85 / 150);
    var r = 54, cx = 60, cy = 60;
    function pt(a) { return [cx + r*Math.cos(a), cy - r*Math.sin(a)]; }
    var angle = Math.PI - pct * Math.PI;
    var p0 = pt(Math.PI), p1 = pt(angle);
    var trackPath = 'M ' + pt(Math.PI)[0] + ' ' + pt(Math.PI)[1] + ' A ' + r + ' ' + r + ' 0 0 1 ' + pt(0)[0] + ' ' + pt(0)[1];
    var largeArc = (angle < Math.PI/2) ? 1 : 0;
    var fillPath = 'M ' + p0[0] + ' ' + p0[1] + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + p1[0] + ' ' + p1[1];
    var svgNS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 120 68'); svg.setAttribute('width', String(width)); svg.setAttribute('height', String(height));
    var track = document.createElementNS(svgNS,'path');
    track.setAttribute('d', trackPath); track.setAttribute('stroke', '#D7E0F5'); track.setAttribute('stroke-width', '10');
    track.setAttribute('fill', 'none'); track.setAttribute('stroke-linecap','round');
    svg.appendChild(track);
    if (pct > 0) {
      var fill = document.createElementNS(svgNS,'path');
      fill.setAttribute('d', fillPath); fill.setAttribute('stroke', color); fill.setAttribute('stroke-width', '10');
      fill.setAttribute('fill', 'none'); fill.setAttribute('stroke-linecap','round');
      svg.appendChild(fill);
    }
    return svg;
  }

  function renderQuestion(candId, cat, q) {
    var scores = myScoresFor(candId), notes = myNotesFor(candId), flags = myFlagsFor(candId);
    var asked = askedFor(candId);
    if (!isQuestionExpanded(q.id, asked)) {
      return renderCollapsedQuestion(candId, cat, q, asked, scores, flags);
    }
    var box = el('div', { class: 'sc-question' });

    var headRow = el('div', { class: 'sc-question-head-row' });
    headRow.appendChild(el('button', {
      class: 'sc-collapse-btn',
      title: 'Collapse',
      onclick: function(){ state.expandedQuestions[q.id] = false; render(); }
    }, ['\u25be']));
    var qText = el('p', { class: 'sc-question-text' });
    q.text.split('\n').forEach(function(line, idx){
      if (idx > 0) qText.appendChild(el('br', {}));
      qText.appendChild(document.createTextNode(line));
    });
    headRow.appendChild(qText);
    var askedLabel = el('label', { class: 'sc-asked-check' });
    var askedInput = el('input', {
      type: 'checkbox',
      onchange: function(e){ asked[q.id] = e.target.checked; delete state.expandedQuestions[q.id]; saveAsked(); render(); }
    });
    askedInput.checked = !!asked[q.id];
    askedLabel.appendChild(askedInput);
    askedLabel.appendChild(document.createTextNode('Covered'));
    headRow.appendChild(askedLabel);
    box.appendChild(headRow);

    if (q.listenFor || q.redFlags) {
      var isOpen = !!state.openHelp[q.id];
      box.appendChild(renderHelpToggle(q.id, isOpen));
      if (isOpen) {
        var helpBody = el('div', { class: 'sc-help-body' });
        var p1 = el('p', { class: 'sc-help' }); p1.innerHTML = '<b>Strong answer:</b> ' + (q.listenFor || '');
        var p2 = el('p', { class: 'sc-help redflag' }); p2.innerHTML = '<b>Red flags:</b> ' + (q.redFlags || '');
        helpBody.appendChild(p1); helpBody.appendChild(p2);
        box.appendChild(helpBody);
      }
    }
    if (q.isTechChecklist) {
      box.appendChild(renderTechChecklist(candId, q));
    } else if (!q.noScore && !cat.nonScored) {
      var scoreRow = el('div', { class: 'sc-score-row' });
      for (var i = 1; i <= 5; i++) {
        (function(val){
          var selected = scores[q.id] === val;
          scoreRow.appendChild(el('button', {
            class: 'sc-score-btn' + (selected ? ' selected-' + val : ''),
            onclick: function(){
              if (scores[q.id] === val) delete scores[q.id]; else scores[q.id] = val;
              saveMine(); render();
            }
          }, [String(val)]));
        })(i);
      }
      scoreRow.appendChild(el('span', { class: 'sc-score-label' }, ['1 = concern \u00b7 5 = exceptional']));
      box.appendChild(scoreRow);
    }
    if (!q.noNotes) {
      var textarea = el('textarea', { class: 'sc-notes', placeholder: 'Notes from the answer\u2026',
        oninput: function(e){ notes[q.id] = e.target.value; saveMine(); },
        onkeydown: function(e){ handleBulletKeydown(e, textarea, function(v){ notes[q.id] = v; saveMine(); }); },
        onfocus: bulletFocusFix
      });
      textarea.value = notes[q.id] || '\u2022 ';
      box.appendChild(textarea);
    }

    if (!q.noNotes) {
      var currentFlag = flags[q.id] || {};
      var flagRow = el('div', { class: 'sc-flag-row' });

      function noteKey(type) { return q.id + '_' + type; }
      function hasText(type) { return currentFlag[type] && currentFlag[type].trim().length > 0; }
      function isShown(type) { return state.noteOpen[noteKey(type)] || hasText(type); }

      ['pro','con'].forEach(function(type){
        var activeClass = type === 'pro' ? 'green-active' : 'red-active';
        var label = type === 'pro' ? '\u2713 Strength' : '\u26a0 Concern';
        flagRow.appendChild(el('button', {
          class: 'sc-flag-btn' + (hasText(type) ? ' ' + activeClass : ''),
          onclick: function(){
            state.noteOpen[noteKey(type)] = !isShown(type);
            render();
          }
        }, [label]));
      });
      box.appendChild(flagRow);

      ['pro','con'].forEach(function(type){
        if (!isShown(type)) return;
        var noteWrap = el('div', { style: 'margin-top:8px;' });
        var noteArea = el('textarea', {
          class: 'sc-flag-note',
          placeholder: type === 'pro' ? 'What made this a strength? (shows on recap)' : 'What\u2019s the concern? (shows on recap)',
          oninput: function(e){
            var f = flags[q.id] || (flags[q.id] = {});
            f[type] = e.target.value;
            saveMine();
          },
          onkeydown: function(e){
            handleBulletKeydown(e, noteArea, function(v){
              var f = flags[q.id] || (flags[q.id] = {});
              f[type] = v;
              saveMine();
            });
          },
          onfocus: bulletFocusFix
        });
        noteArea.value = currentFlag[type] || '\u2022 ';
        noteWrap.appendChild(noteArea);
        if (hasText(type)) {
          noteWrap.appendChild(el('button', {
            class: 'sc-colleague-load',
            style: 'margin-top:4px; color:var(--red);',
            onclick: function(){
              if (!confirm('Delete this ' + (type === 'pro' ? 'strength' : 'concern') + ' note?')) return;
              var f = flags[q.id];
              if (f) f[type] = '';
              state.noteOpen[noteKey(type)] = false;
              saveMine(); render();
            }
          }, ['Delete note']));
        }
        box.appendChild(noteWrap);
      });
    }

    return box;
  }

  function renderRecapFor(flags, title) {
    var box = el('div', { class: 'sc-recap' });
    box.appendChild(el('h4', {}, [title || 'Recap']));
    var greens = [], reds = [];
    Object.keys(flags).forEach(function(qid){
      var lookup = questionById(qid);
      if (!lookup) return;
      var f = flags[qid];
      if (f.pro && f.pro.trim()) greens.push({ text: lookup.q.text, note: f.pro });
      if (f.con && f.con.trim()) reds.push({ text: lookup.q.text, note: f.con });
    });
    if (!greens.length && !reds.length) {
      box.appendChild(el('div', { class: 'sc-recap-empty' }, ['No strengths or concerns flagged yet.']));
      return box;
    }
    if (greens.length) {
      box.appendChild(el('div', { class: 'sc-recap-sub green' }, ['Strengths (' + greens.length + ')']));
      greens.forEach(function(item){
        var el2 = el('div', { class: 'sc-recap-item green' });
        el2.appendChild(el('div', { class: 'rq' }, [item.text.length > 70 ? item.text.slice(0,70) + '\u2026' : item.text]));
        if (item.note) el2.appendChild(el('div', { class: 'rn' }, [item.note]));
        box.appendChild(el2);
      });
    }
    if (reds.length) {
      box.appendChild(el('div', { class: 'sc-recap-sub red' }, ['Concerns (' + reds.length + ')']));
      reds.forEach(function(item){
        var el2 = el('div', { class: 'sc-recap-item red' });
        el2.appendChild(el('div', { class: 'rq' }, [item.text.length > 70 ? item.text.slice(0,70) + '\u2026' : item.text]));
        if (item.note) el2.appendChild(el('div', { class: 'rn' }, [item.note]));
        box.appendChild(el2);
      });
    }
    return box;
  }

  function resizeImageFile(file, maxSize) {
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          try {
            var canvas = document.createElement('canvas');
            var w = img.width, h = img.height;
            var scale = Math.min(1, maxSize / Math.max(w, h));
            canvas.width = Math.max(1, Math.round(w * scale));
            canvas.height = Math.max(1, Math.round(h * scale));
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          } catch (err) { reject(err); }
        };
        img.onerror = function(){ reject(new Error('Could not read image')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('Could not read file')); };
      reader.readAsDataURL(file);
    });
  }

        var file = e.target.files && e.target.files[0];
        if (!file) return;
        uploadBtn.disabled = true;
        uploadBtn.textContent = 'Processing\u2026';
        resizeImageFile(file, 220).then(function(dataUrl){

          urlInput.value = '';

        });

    });

      class: 'sc-photo-upload-btn',
      onclick: function(){ fileInput.click(); }
    }, ['\ud83d\udcf7 Upload Photo']);

  function handleBulletKeydown(e, textarea, onChange) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    // If nothing has been typed yet beyond the default bullet, do nothing -
    // otherwise a stray blank line + doubled bullet can appear above the text.
    if (textarea.value === '\u2022 ') return;
    var start = textarea.selectionStart, end = textarea.selectionEnd;
    var value = textarea.value;
    var before = value.slice(0, start), after = value.slice(end);
    var insertion = '\n\u2022 ';
    var newValue = before + insertion + after;
    textarea.value = newValue;
    var newPos = start + insertion.length;
    textarea.selectionStart = textarea.selectionEnd = newPos;
    onChange(newValue);
  }
  function handleNumberedKeydown(e, textarea, onChange) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (textarea.value === '1. ') return;
    var start = textarea.selectionStart, end = textarea.selectionEnd;
    var value = textarea.value;
    var before = value.slice(0, start), after = value.slice(end);
    var linesBefore = before.split('\n');
    var count = 0;
    linesBefore.forEach(function(line){ if (/^\d+\.\s/.test(line)) count++; });
    var nextNum = count + 1;
    var insertion = '\n' + nextNum + '. ';
    var newValue = before + insertion + after;
    textarea.value = newValue;
    var newPos = start + insertion.length;
    textarea.selectionStart = textarea.selectionEnd = newPos;
    onChange(newValue);
  }
  function bulletFocusFix(e){
    var ta = e.target;
    if (ta.value === '\u2022 ' || ta.value === '1. ') {
      ta.selectionStart = ta.selectionEnd = ta.value.length;
    }
  }

  function formatDateNice(dateStr) {
    if (!dateStr) return '';
    var parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr;
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function formatTimeNice(timeStr) {
    if (!timeStr) return '';
    var parts = timeStr.split(':');
    var h = Number(parts[0]), m = parts[1];
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ':' + m + ' ' + ampm;
  }
  function candidateSortKey(meta) {
    if (!meta.date) return null;
    return meta.date + ' ' + (meta.time || '00:00');
  }
  function activeCandidateIds() {
    return state.candidatesMeta.order.filter(function(id){ return !state.candidatesMeta.byId[id].archived; });
  }
  function sortedCandidateIds() {
    var ids = (state.showArchived ? state.candidatesMeta.order.slice() : activeCandidateIds());
    ids.sort(function(a, b){
      var ka = candidateSortKey(state.candidatesMeta.byId[a]);
      var kb = candidateSortKey(state.candidatesMeta.byId[b]);
      if (ka === null && kb === null) return 0;
      if (ka === null) return 1;
      if (kb === null) return -1;
      return ka < kb ? -1 : ka > kb ? 1 : 0;
    });
    return ids;
  }
  function candidateDateTime(meta) {
    if (!meta.date) return null;
    var d = new Date(meta.date + 'T' + (meta.time || '23:59') + ':00');
    return isNaN(d.getTime()) ? null : d;
  }
  function isCandidatePast(meta) {
    var dt = candidateDateTime(meta);
    if (!dt) return false;
    return dt.getTime() < Date.now();
  }
  function getNextUpCandidateId() {
    var upcoming = activeCandidateIds().filter(function(id){
      var meta = state.candidatesMeta.byId[id];
      return meta.date && !isCandidatePast(meta);
    });
    if (!upcoming.length) return null;
    upcoming.sort(function(a, b){
      var ka = candidateSortKey(state.candidatesMeta.byId[a]);
      var kb = candidateSortKey(state.candidatesMeta.byId[b]);
      return ka < kb ? -1 : ka > kb ? 1 : 0;
    });
    return upcoming[0];
  }

  function renderScheduleDashboard() {
    var ids = activeCandidateIds();
    if (!ids.length) return null;
    var scheduled = ids.filter(function(id){ return state.candidatesMeta.byId[id].date; });
    var unscheduled = ids.filter(function(id){ return !state.candidatesMeta.byId[id].date; });
    if (!scheduled.length) return null;

    var byDate = {};
    scheduled.forEach(function(id){
      var meta = state.candidatesMeta.byId[id];
      if (!byDate[meta.date]) byDate[meta.date] = [];
      byDate[meta.date].push(id);
    });
    var dateKeys = Object.keys(byDate).sort();
    dateKeys.forEach(function(dk){
      byDate[dk].sort(function(a, b){
        var ta = state.candidatesMeta.byId[a].time || '';
        var tb = state.candidatesMeta.byId[b].time || '';
        return ta < tb ? -1 : ta > tb ? 1 : 0;
      });
    });

    var box = el('div', { class: 'sc-schedule-dash' });
    box.appendChild(el('h3', { class: 'sc-schedule-dash-title' }, ['Interview Schedule']));
    var row = el('div', { class: 'sc-schedule-dash-row' });
    var nextUpId = getNextUpCandidateId();
    dateKeys.forEach(function(dk){
      var col = el('div', { class: 'sc-schedule-day-col' });
      col.appendChild(el('div', { class: 'sc-schedule-day-head' }, [formatDateNice(dk)]));
      byDate[dk].forEach(function(id){
        var meta = state.candidatesMeta.byId[id];
        var isPast = isCandidatePast(meta);
        var isNext = id === nextUpId;
        var chipClass = 'sc-schedule-chip' + (id === state.activeId ? ' active' : '') + (isPast ? ' sc-chip-past' : '') + (isNext ? ' sc-chip-next' : '');

        }, [

        ]);
        if (isNext) chip.appendChild(el('div', { class: 'sc-chip-next-label' }, ['\u25b6 Next up']));
        col.appendChild(chip);
      });
      row.appendChild(col);
    });
    if (unscheduled.length) {
      var col2 = el('div', { class: 'sc-schedule-day-col sc-schedule-unscheduled' });
      col2.appendChild(el('div', { class: 'sc-schedule-day-head' }, ['Unscheduled']));
      unscheduled.forEach(function(id){
        var meta = state.candidatesMeta.byId[id];
        col2.appendChild(el('div', {
          class: 'sc-schedule-chip' + (id === state.activeId ? ' active' : ''),
          onclick: function(){ state.activeId = id; state.view = 'scorecard'; render(); }
        }, [
          el('div', { class: 'sc-schedule-chip-name' }, [meta.name || 'Untitled'])
        ]));

      row.appendChild(col2);
    }
    box.appendChild(row);
    return box;
  }

  function getReviewerData(name) {
    if (name === state.reviewerName) return state.mine;
    return state.colleagueCache[name] || { scores: {}, notes: {}, rec: {}, flags: {}, tech: {} };
  }

  function compareReviewersList() {
    return [state.reviewerName].concat(state.knownReviewers.filter(function(n){ return n !== state.reviewerName; }));
  }

  function candidatesSortedByAverage() {
    var reviewers = compareReviewersList();
    function avgFor(id){
      var vals = [];
      reviewers.forEach(function(n){
        var data = getReviewerData(n);
        var scores = (data.scores && data.scores[id]) || {};
        var s = overallStatsFor(scores);
        if (s.answeredQ > 0) vals.push(s.weighted);
      });
      return vals.length ? vals.reduce(function(x,y){return x+y;},0)/vals.length : 0;
    }
    return activeCandidateIds().sort(function(a,b){ return avgFor(b) - avgFor(a); });
  }

  function renderCompareMiniSummary(name, candId, isAverage, reviewers) {
    var wrap = el('div', { class: 'sc-compare-mini' + (isAverage ? ' sc-compare-mini-avg' : '') });
    wrap.appendChild(el('div', { class: 'sc-compare-mini-name' }, [isAverage ? 'Average' : (name + (name === state.reviewerName ? ' (you)' : ''))]));

    var overall, dataSelf;
    if (isAverage) {
      var totals = [];
      reviewers.forEach(function(n){
        var d = getReviewerData(n);
        var sc = (d.scores && d.scores[candId]) || {};
        var st = overallStatsFor(sc);
        if (st.answeredQ > 0) totals.push(st.weighted);
      });
      var max = totalMaxWeight();
      var avgWeighted = totals.length ? totals.reduce(function(a,b){return a+b;},0)/totals.length : 0;
      overall = { weighted: avgWeighted, max: max, answeredQ: totals.length };
    } else {
      dataSelf = getReviewerData(name);
      var scores = (dataSelf.scores && dataSelf.scores[candId]) || {};
      overall = overallStatsFor(scores);
    }
    var pct = overall.max ? overall.weighted / overall.max : 0;
    var v = verdictFor(pct);

    var gaugeWrap = el('div', { class: 'sc-gauge-wrap' });
    gaugeWrap.appendChild(gaugeSvg(pct, v.color, 110));
    gaugeWrap.appendChild(el('div', { class: 'sc-gauge-total', style: 'color:' + v.color + '; font-size:20px; margin-top:-24px;' }, [overall.answeredQ ? overall.weighted.toFixed(1) : '\u2014']));
    gaugeWrap.appendChild(el('div', { class: 'sc-gauge-max' }, ['out of ' + overall.max]));
    gaugeWrap.appendChild(el('div', { class: 'sc-gauge-verdict', style: 'color:' + v.color }, [overall.answeredQ ? v.label : 'Not yet scored']));
    wrap.appendChild(gaugeWrap);

    state.categories.forEach(function(cat){
      if (cat.nonScored) return;
      var catStat;
      if (isAverage) {
        var avgs = [];
        reviewers.forEach(function(n){
          var d = getReviewerData(n);
          var sc = (d.scores && d.scores[candId]) || {};
          var s = categoryStatsFor(sc, cat);
          if (s.answered > 0) avgs.push(s.avg);
        });
        var avg = avgs.length ? avgs.reduce(function(a,b){return a+b;},0)/avgs.length : 0;
        catStat = { avg: avg, answered: avgs.length, weighted: avg * Number(cat.weight || 0) };
      } else {
        var scores2 = (dataSelf.scores && dataSelf.scores[candId]) || {};
        catStat = categoryStatsFor(scores2, cat);
      }
      var catPct = catStat.avg / 5;
      var row = el('div', { class: 'sc-catbar-row' });
      row.appendChild(el('div', { class: 'sc-catbar-label' }, [
        el('span', {}, [cat.name]), el('span', {}, [catStat.answered ? catStat.weighted.toFixed(1) : '\u2014'])
      ]));
      var track = el('div', { class: 'sc-catbar-track' });
      var fillColor = catPct >= 0.75 ? 'var(--green)' : catPct >= 0.5 ? 'var(--amber)' : catPct > 0 ? 'var(--red)' : 'var(--hairline)';
      track.appendChild(el('div', { class: 'sc-catbar-fill', style: 'width:' + (catPct*100) + '%; background:' + fillColor }));
      row.appendChild(track);
      wrap.appendChild(row);
    });

    if (!isAverage) {
      var recLabel = { 'strong-yes': 'Strong yes', 'yes-reservations': 'Yes, reservations', 'no': 'No' }[(dataSelf.rec && dataSelf.rec[candId])] || 'Not yet decided';
      wrap.appendChild(el('div', { class: 'sc-compare-mini-rec' }, ['Recommendation: ' + recLabel]));
      var flagsForCand = (dataSelf.flags && dataSelf.flags[candId]) || {};
      wrap.appendChild(renderRecapFor(flagsForCand, 'Strengths & Concerns'));
      var techForCand = (dataSelf.tech && dataSelf.tech[candId]) || {};
      var techBox = renderTechRecapFor(techForCand, 'Software & Tools');
      if (techBox) wrap.appendChild(techBox);
    }

    return wrap;
  }

  function renderCompareView() {
    var wrap = el('div', {});
    if (!state.candidatesMeta.order.length) {
      wrap.appendChild(el('div', { class: 'sc-empty' }, ['Add a candidate to start comparing.']));
      return wrap;
    }
    if (!state.compareLoaded) {
      if (!state.compareLoading) loadAllForCompare();
      wrap.appendChild(el('div', { class: 'sc-loading-note' }, ['Loading everyone\u2019s scores\u2026']));
      return wrap;
    }

    var reviewers = compareReviewersList();
    candidatesSortedByAverage().forEach(function(candId){
      var meta = state.candidatesMeta.byId[candId];
      var card = el('div', { class: 'sc-compare-card' });
      card.appendChild(el('h3', { class: 'sc-compare-cand-name' }, [meta.name || 'Untitled']));
      var row = el('div', { class: 'sc-compare-mini-row' });
      reviewers.forEach(function(name){
        row.appendChild(renderCompareMiniSummary(name, candId, false, reviewers));
      });
      row.appendChild(renderCompareMiniSummary(null, candId, true, reviewers));
      card.appendChild(row);
      wrap.appendChild(card);
    });
    wrap.appendChild(el('div', { class: 'sc-save-note' }, ['Average combines every reviewer who has scored that candidate so far.']));
    return wrap;
  }

  // ---------- manage questions view ----------
  var dragCatIndex = null;
  var dragQInfo = null; // { catIdx, qIdx }

  function moveInArray(arr, from, to) {
    var item = arr.splice(from, 1)[0];
    var adjustedTo = from < to ? to - 1 : to;
    arr.splice(adjustedTo, 0, item);
  }
  function moveQuestion(fromCatIdx, fromQIdx, toCatIdx, toQIdx) {
    var item = state.categories[fromCatIdx].questions.splice(fromQIdx, 1)[0];
    var toArr = state.categories[toCatIdx].questions;
    var adjustedTo = (fromCatIdx === toCatIdx && fromQIdx < toQIdx) ? toQIdx - 1 : toQIdx;
    toArr.splice(adjustedTo, 0, item);
  }

  function renderManageView() {
    var wrap = el('div', {});
    wrap.appendChild(el('p', { style: 'font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;' }, [
      'Changes here are shared \u2014 both reviewers will see the updated categories and questions right away. Existing scores stay tied to their question, so editing question text later won\u2019t erase anyone\u2019s scores. Drag the \u2261 handle to reorder categories or questions, or to move a question into a different category.'
    ]));
    state.categories.forEach(function(cat, catIdx){
      var card = el('div', {
        class: 'sc-manage-cat',
        draggable: 'true',
        ondragstart: function(e){ dragCatIndex = catIdx; e.dataTransfer.effectAllowed = 'move'; e.stopPropagation(); },
        ondragover: function(e){ if (dragCatIndex === null) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; card.classList.add('sc-drag-over'); },
        ondragleave: function(){ card.classList.remove('sc-drag-over'); },
        ondrop: function(e){
          e.preventDefault(); e.stopPropagation(); card.classList.remove('sc-drag-over');
          if (dragCatIndex === null || dragCatIndex === catIdx) { dragCatIndex = null; return; }
          moveInArray(state.categories, dragCatIndex, catIdx);
          dragCatIndex = null; saveCategories(); render();
        },
        ondragend: function(){ dragCatIndex = null; card.classList.remove('sc-drag-over'); }
      });
      var head = el('div', { class: 'sc-manage-cat-head' });
      head.appendChild(el('span', { class: 'sc-drag-handle', title: 'Drag to reorder' }, ['\u2261']));
      var nameInput = el('input', { class: 'sc-cat-name', oninput: function(e){ cat.name = e.target.value; saveCategories(); } });
      nameInput.value = cat.name;
      head.appendChild(nameInput);
      var weightWrap = el('div', { class: 'sc-weight-input-wrap' }, [ el('span', {}, ['weight \u00d7']) ]);
      var weightInput = el('input', { class: 'sc-cat-weight', type: 'number', min: '1', max: '10',
        oninput: function(e){ cat.weight = Number(e.target.value) || 1; saveCategories(); renderSummaryLive(); } });
      weightInput.value = cat.weight;
      weightWrap.appendChild(weightInput);
      head.appendChild(weightWrap);
      var nonScoredLabel = el('label', { style: 'display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-soft); font-weight:600; cursor:pointer;' });
      var nonScoredCheck = el('input', { type: 'checkbox', onchange: function(e){ cat.nonScored = e.target.checked; saveCategories(); render(); } });
      nonScoredCheck.checked = !!cat.nonScored;
      nonScoredLabel.appendChild(nonScoredCheck);
      nonScoredLabel.appendChild(document.createTextNode('Not scored (talking points only)'));
      head.appendChild(nonScoredLabel);
      head.appendChild(el('button', { class: 'sc-del-cat', onclick: function(){
        if (!confirm('Delete category "' + cat.name + '" and all its questions?')) return;
        state.categories.splice(catIdx, 1); saveCategories(); render();
      } }, ['Delete category']));
      card.appendChild(head);

      cat.questions.forEach(function(q, qIdx){
        var qCard = el('div', {
          class: 'sc-manage-q',
          draggable: 'true',
          ondragstart: function(e){ dragQInfo = { catIdx: catIdx, qIdx: qIdx }; e.dataTransfer.effectAllowed = 'move'; e.stopPropagation(); },
          ondragover: function(e){ if (!dragQInfo) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; qCard.classList.add('sc-drag-over'); e.stopPropagation(); },
          ondragleave: function(){ qCard.classList.remove('sc-drag-over'); },
          ondrop: function(e){
            e.preventDefault(); e.stopPropagation(); qCard.classList.remove('sc-drag-over');
            if (!dragQInfo) return;
            if (dragQInfo.catIdx === catIdx && dragQInfo.qIdx === qIdx) { dragQInfo = null; return; }
            moveQuestion(dragQInfo.catIdx, dragQInfo.qIdx, catIdx, qIdx);
            dragQInfo = null; saveCategories(); render();
          },
          ondragend: function(){ dragQInfo = null; qCard.classList.remove('sc-drag-over'); }
        });
        var qHeadRow = el('div', { style: 'display:flex; align-items:center; gap:8px; flex-wrap:wrap;' });
        qHeadRow.appendChild(el('span', { class: 'sc-drag-handle', title: 'Drag to reorder or move to another category' }, ['\u2261']));
        qHeadRow.appendChild(el('label', { style: 'margin:0;' }, [(q.noScore || cat.nonScored) ? 'Talking point' : 'Question']));
        if (!cat.nonScored) {
          var toggleWrap = el('div', { style: 'display:flex; gap:12px; margin-left:auto;' });
          var noScoreLabel = el('label', { style: 'display:flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-soft); font-weight:600; cursor:pointer;' });
          var noScoreCheck = el('input', { type: 'checkbox', onchange: function(e){ q.noScore = e.target.checked; saveCategories(); render(); } });
          noScoreCheck.checked = !!q.noScore;
          noScoreLabel.appendChild(noScoreCheck);
          noScoreLabel.appendChild(document.createTextNode('Talking point (no score)'));
          toggleWrap.appendChild(noScoreLabel);
          var noNotesLabel = el('label', { style: 'display:flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-soft); font-weight:600; cursor:pointer;' });
          var noNotesCheck = el('input', { type: 'checkbox', onchange: function(e){ q.noNotes = e.target.checked; saveCategories(); render(); } });
          noNotesCheck.checked = !!q.noNotes;
          noNotesLabel.appendChild(noNotesCheck);
          noNotesLabel.appendChild(document.createTextNode('No notes field'));
          toggleWrap.appendChild(noNotesLabel);
          qHeadRow.appendChild(toggleWrap);
        }
        qCard.appendChild(qHeadRow);
        var qText = el('textarea', { rows: '2', oninput: function(e){ q.text = e.target.value; saveCategories(); } });
        qText.value = q.text; qCard.appendChild(qText);
        if (!q.noScore && !cat.nonScored) {
          qCard.appendChild(el('label', {}, ['What a strong answer sounds like']));
          var qListen = el('textarea', { rows: '2', oninput: function(e){ q.listenFor = e.target.value; saveCategories(); } });
          qListen.value = q.listenFor || ''; qCard.appendChild(qListen);
          qCard.appendChild(el('label', {}, ['Red flags']));
          var qRed = el('textarea', { rows: '2', oninput: function(e){ q.redFlags = e.target.value; saveCategories(); } });
          qRed.value = q.redFlags || ''; qCard.appendChild(qRed);
        }
        var footer = el('div', { class: 'sc-manage-q-footer' });
        footer.appendChild(el('button', { onclick: function(){
          if (!confirm('Delete this question?')) return;
          cat.questions.splice(qIdx, 1); saveCategories(); render();
        } }, ['Delete question']));
        qCard.appendChild(footer);
        card.appendChild(qCard);
      });

      var dropZone = el('div', {
        class: 'sc-cat-dropzone',
        ondragover: function(e){ if (!dragQInfo) return; e.preventDefault(); dropZone.classList.add('sc-drag-over'); },
        ondragleave: function(){ dropZone.classList.remove('sc-drag-over'); },
        ondrop: function(e){
          e.preventDefault(); dropZone.classList.remove('sc-drag-over');
          if (!dragQInfo) return;
          moveQuestion(dragQInfo.catIdx, dragQInfo.qIdx, catIdx, cat.questions.length);
          dragQInfo = null; saveCategories(); render();
        }
      });
      card.appendChild(dropZone);

      var addBtnRow = el('div', { style: 'display:flex; gap:8px; flex-wrap:wrap;' });
      addBtnRow.appendChild(el('button', { class: 'sc-add-q-btn', style: 'width:auto; flex:1;', onclick: function(){
        cat.questions.push({ id: uid(), text: 'New question\u2026', listenFor: '', redFlags: '' });
        saveCategories(); render();
      } }, ['+ Add question']));
      if (!cat.nonScored) {
        addBtnRow.appendChild(el('button', { class: 'sc-add-q-btn', style: 'width:auto; flex:1;', onclick: function(){
          cat.questions.push({ id: uid(), text: 'New talking point\u2026', noScore: true });
          saveCategories(); render();
        } }, ['+ Add talking point']));
      }
      card.appendChild(addBtnRow);

      wrap.appendChild(card);
    });

    var catDropZone = el('div', {
      class: 'sc-cat-dropzone',
      ondragover: function(e){ if (dragCatIndex === null) return; e.preventDefault(); catDropZone.classList.add('sc-drag-over'); },
      ondragleave: function(){ catDropZone.classList.remove('sc-drag-over'); },
      ondrop: function(e){
        e.preventDefault(); catDropZone.classList.remove('sc-drag-over');
        if (dragCatIndex === null) return;
        moveInArray(state.categories, dragCatIndex, state.categories.length);
        dragCatIndex = null; saveCategories(); render();
      }
    });
    wrap.appendChild(catDropZone);

    wrap.appendChild(el('button', { class: 'sc-add-cat-btn', onclick: function(){
      state.categories.push({ id: uid(), name: 'New category', weight: 1, questions: [] });
      saveCategories(); render();
    } }, ['+ Add category']));

    return wrap;
  }

  function renderSummaryLive() {
    var existing = root.querySelector('.sc-summary');
    if (existing && state.activeId) existing.replaceWith(renderSummary(state.activeId));
  }

  // ---------- main render ----------
  function render() {
    root.innerHTML = '';
    if (!state.reviewerName) { renderReviewerPrompt(); return; }

    var masthead = el('div', { class: 'sc-masthead' }, [
      el('div', {}, [
        el('div', { class: 'eyebrow' }, ['McLain Properties']),
        el('h1', {}, ['Admin Assistant \u2014 Interview Scorecard']),
        el('div', { class: 'sub' }, ['Candidates, schedule, and candidate details are shared. Pre-interview notes and interview scoring are private to each reviewer.'])
      ]),
      el('div', { class: 'sc-view-toggle' }, [
        el('button', { class: state.view === 'scorecard' ? 'active' : '', onclick: function(){ state.view = 'scorecard'; render(); } }, ['Scorecard']),
        el('button', { class: state.view === 'compare' ? 'active' : '', onclick: function(){ state.view = 'compare'; state.compareLoaded = false; render(); } }, ['Compare all']),
        el('button', { class: state.view === 'manage' ? 'active' : '', onclick: function(){ state.view = 'manage'; render(); } }, ['Edit questions'])
      ])
    ]);
    root.appendChild(masthead);

    var reviewerBar = el('div', { class: 'sc-reviewer-bar' }, [
      el('span', { class: 'sc-reviewer-pill' }, ['Scoring as: ' + state.reviewerName]),
      el('button', { onclick: function(){ state.reviewerName = null; render(); } }, ['Not you? Switch reviewer'])
    ]);
    root.appendChild(reviewerBar);

    if (state.view === 'manage') { root.appendChild(renderManageView()); return; }
    if (state.view === 'compare') { root.appendChild(renderCompareView()); return; }

    var scheduleDash = renderScheduleDashboard();
    if (scheduleDash) root.appendChild(scheduleDash);

    var archivedCount = state.candidatesMeta.order.filter(function(id){ return state.candidatesMeta.byId[id].archived; }).length;
    var candidatesTitleRow = el('div', { class: 'sc-section-title-row' }, [
      el('h3', { class: 'sc-section-title', style: 'margin:0; border:none; padding:0;' }, ['Candidates'])
    ]);
    if (archivedCount > 0) {
      candidatesTitleRow.appendChild(el('button', {
        class: 'sc-archive-toggle',
        onclick: function(){ state.showArchived = !state.showArchived; render(); }
      }, [state.showArchived ? 'Hide archived' : 'Show archived (' + archivedCount + ')']));
    }
    var candidatesBox = el('div', { class: 'sc-section-box sc-candidates-box' }, [candidatesTitleRow]);
    candidatesBox.appendChild(renderTabs());
    root.appendChild(candidatesBox);

    if (!state.activeId || !state.candidatesMeta.byId[state.activeId]) {
      root.appendChild(el('div', { class: 'sc-empty' }, ['No candidate selected.']));
      return;
    }

    var activeMeta = state.candidatesMeta.byId[state.activeId];
    var detailsTitleRow = el('div', { class: 'sc-section-title-row' }, [
      el('h3', { class: 'sc-section-title', style: 'margin:0; border:none; padding:0;' }, ['Candidate Details'])
    ]);
    detailsTitleRow.appendChild(el('button', {
      class: 'sc-archive-toggle',
      onclick: function(){
        var candIdBeingArchived = state.activeId;
        activeMeta.archived = !activeMeta.archived;
        saveCandidates();
        if (activeMeta.archived && !state.showArchived) {
          var remaining = activeCandidateIds();
          state.activeId = remaining.length ? remaining[0] : null;
        }
        render();
      }
    }, [activeMeta.archived ? '\u21a9 Unarchive' : '\ud83d\udce6 Archive']));
    var detailsBox = el('div', { class: 'sc-section-box' }, [detailsTitleRow]);
    var detailsLayout = el('div', { class: 'sc-details-layout' });
    detailsLayout.appendChild(renderPhotoBlock(state.activeId));
    var detailsRight = el('div', { class: 'sc-details-right' });
    detailsRight.appendChild(renderMetaRow(state.activeId));
    detailsRight.appendChild(renderRateRow(state.activeId));
    detailsLayout.appendChild(detailsRight);
    detailsBox.appendChild(detailsLayout);
    root.appendChild(detailsBox);

    root.appendChild(renderPreNotes(state.activeId));
    root.appendChild(renderPersonalityAssessment(state.activeId));

    var grid = el('div', { class: 'sc-grid' });
    var main = el('div', {});
    main.appendChild(el('h2', { class: 'sc-section-title sc-interview-title' }, ['Interview Questions']));
    state.categories.forEach(function(cat){ main.appendChild(renderCategory(state.activeId, cat)); });
    grid.appendChild(main);
    grid.appendChild(renderSummary(state.activeId));
    root.appendChild(grid);
    root.appendChild(renderSaveNote());
  }

  // ---------- boot ----------
  function migratePreNotesFormatting() {
    var changed = false;
    state.candidatesMeta.order.forEach(function(id){
      var meta = state.candidatesMeta.byId[id];
      if (meta.preNotes && meta.preNotes.trim() && meta.preNotes.indexOf('\u2022') !== 0) {
        meta.preNotes = '\u2022 ' + meta.preNotes;
        changed = true;
      }
      if (meta.techGapsNote && meta.techGapsNote.trim() && meta.techGapsNote.indexOf('\u2022') !== 0) {
        meta.techGapsNote = '\u2022 ' + meta.techGapsNote;
        changed = true;
      }
      if (meta.preQuestions && meta.preQuestions.trim() && !/^\d+\.\s/.test(meta.preQuestions)) {
        meta.preQuestions = '1. ' + meta.preQuestions;
        changed = true;
      }
    });
    return changed;
  }

  async function boot() {
    var names = await safeGet(NAMES_KEY);
    state.knownReviewers = names || [];

    var cands = await safeGet(CAND_KEY);
    if (cands && cands.order && cands.order.length) {
      state.candidatesMeta = cands;
      if (migratePreNotesFormatting()) {
        await safeSet(CAND_KEY, state.candidatesMeta);
      }
    } else {
      var id = uid();
      state.candidatesMeta = { order: [id], byId: {} };
      state.candidatesMeta.byId[id] = { name: 'Candidate 1', date: '' };
      await safeSet(CAND_KEY, state.candidatesMeta);
    }

    var cats = await safeGet(QSET_KEY);
    if (cats && cats.length) {
      state.categories = cats;
    } else {
      state.categories = DEFAULT_CATEGORIES;
      await safeSet(QSET_KEY, state.categories);
    }

    var asked = await safeGet(ASKED_KEY);
    state.askedMap = asked || {};

    // Sections start collapsed by default each time the tool loads, so the
    // page opens clean instead of showing every category expanded.
    state.categories.forEach(function(cat){ state.collapsedCats[cat.id] = true; });

    render();

    // Keep the past/next-up highlighting current even if the tool is left open.
    setInterval(function(){ renderTabsOnly(); renderScheduleDashOnly(); }, 60000);
  }

  boot();
})();
</script>
